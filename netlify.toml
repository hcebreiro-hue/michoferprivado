[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # La agenda web habla con el servidor de Senda (src/licencia/config.ts → URL_SERVIDOR).
  # No lleva credenciales: la ruta pública solo devuelve horarios ocupados.

# SPA routing: los archivos estáticos existentes (_expo/*, assets/*, favicon.ico)
# se sirven primero; toda otra ruta (/reservas, /configuracion, /, etc.) cae a index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Assets con hash: cache largo inmutable
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html: siempre la última versión
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
